<div class="p-0 min-h-screen bg-slate-50">

  <div class="flex justify-between items-stretch min-h-screen">

    <!-- ================= Right Side ================= -->
    <div class="w-full p-[16px] sm:p-[24px] min-h-screen flex flex-col justify-between bg-gradient-to-tr from-[#f8fafc] via-[#f1f5f9] to-[#eff6ff] overflow-y-auto relative">

      <!-- Header -->
      <div class="w-full h-fit flex items-center justify-between z-10">
        <div class="w-10 h-10 md:hidden"></div>
        <app-auth-logo></app-auth-logo>
        <button (click)="clearLocalStorage()" class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-slate-600 hover:text-red-600 bg-slate-100/60 hover:bg-red-50 rounded-full border border-slate-200/60 hover:border-red-100 transition-all duration-200 cursor-pointer ms-auto">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>{{ 'auth.logout' | translate }}</span>
        </button>
      </div>

      <!-- Content Centered Vertically -->
      <div class="flex-1 flex flex-col justify-center w-[95%] md:w-[92%] lg:w-[90%] max-w-[700px] mx-auto py-8 z-10">

        <div class="w-full bg-white/95 backdrop-blur-md rounded-3xl border border-slate-100 shadow-2xl shadow-slate-200/50 p-6 sm:p-10 transition-all duration-300">

          <div class="text-center">
            
            <!-- Success Icon -->
            <div class="flex justify-center mb-6 relative">
              <div class="pulse-ring absolute inset-0 rounded-full w-[140px] h-[140px] mx-auto opacity-50 bg-[#10B981]/20"></div>
              <div class="w-[140px] h-[140px] bg-gradient-to-tr from-[#10B981] to-[#34D399] rounded-full shadow-lg border-[4px] border-white z-10 relative animate-float-slow flex items-center justify-center">
                <svg class="w-[70px] h-[70px] text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
            </div>

            <h2 class="text-slate-800 text-[26px] sm:text-[30px] font-bold leading-tight tracking-tight">
              Waiting for Activation
            </h2>

            <p class="text-slate-500 text-[15px] sm:text-[16px] font-normal leading-relaxed mt-4">
              We are reviewing your profile and certificates. Please check back within 2 days to track your activation status.
            </p>

            <div class="mt-6 p-4 bg-sky-50/50 border border-sky-100 rounded-2xl flex items-start gap-3 text-left">
              <i class="fa-solid fa-circle-info text-(--primary-color) mt-[2px] text-lg shrink-0"></i>
              <p class="text-slate-600 text-sm font-medium leading-relaxed">
                If you have any questions or your account takes longer to activate, please contact our support team.
              </p>
            </div>

            <div class="w-full mt-8">
              <button (click)="clearLocalStorage()" class="w-full bg-gradient-to-r from-(--primary-color) to-[#006ba5] text-white hover:from-[#006ba5] hover:to-[#005a8c] px-5 h-[54px] rounded-full text-base font-bold flex items-center justify-center gap-2 shadow-lg shadow-(--primary-color)/15 hover:shadow-xl hover:shadow-(--primary-color)/25 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 ease-in-out cursor-pointer">
                <span>Back To Home</span>
                <i class="fa-solid fa-arrow-right text-[15px] ml-1"></i>
              </button>
            </div>

          </div>

        </div>

      </div>

      <!-- Footer Spacer/Copyright -->
      <div class="w-full text-center text-xs text-slate-400 mt-4">
        &copy; 2026 teleSEHA. All rights reserved.
      </div>

    </div>

  </div>

</div>
