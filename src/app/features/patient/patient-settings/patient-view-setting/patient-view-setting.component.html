<section class="py-10 bg-slate-50/50 min-h-screen">
  <div class="container mx-auto max-w-[1100px] px-4">
    <div class="bg-white rounded-3xl border border-slate-100 shadow-[0_10px_40px_rgba(0,0,0,0.03)] p-6 md:p-10 mb-6">

      <!-- Tabs Header -->
      <div class="border-b border-slate-100 mb-8 pb-4">
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
          <button (click)="activeTab = 'profile'" 
            [ngClass]="activeTab === 'profile'
              ? 'text-[#007BBD] bg-[#007BBD]/10 font-bold shadow-2xs'
              : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800 font-semibold'"
            class="px-5 py-2.5 rounded-full text-sm sm:text-base transition-all duration-200 whitespace-nowrap cursor-pointer flex items-center gap-2.5">
            <i class="fa-solid fa-id-card text-sm"></i>
            {{ 'settings.profile' | translate }}
          </button>

          <button (click)="activeTab = 'createAccount'" 
            [ngClass]="activeTab === 'createAccount'
              ? 'text-[#007BBD] bg-[#007BBD]/10 font-bold shadow-2xs'
              : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800 font-semibold'"
            class="px-5 py-2.5 rounded-full text-sm sm:text-base transition-all duration-200 whitespace-nowrap cursor-pointer flex items-center gap-2.5">
            <i class="fa-solid fa-user-plus text-sm"></i>
            {{ 'settings.createAccount' | translate }}
          </button>

          <button (click)="activeTab = 'medicalHistory'" 
            [ngClass]="activeTab === 'medicalHistory'
              ? 'text-[#007BBD] bg-[#007BBD]/10 font-bold shadow-2xs'
              : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800 font-semibold'"
            class="px-5 py-2.5 rounded-full text-sm sm:text-base transition-all duration-200 whitespace-nowrap cursor-pointer flex items-center gap-2.5">
            <i class="fa-solid fa-notes-medical text-sm"></i>
            {{ 'settings.medicalHistory' | translate }}
          </button>
        </div>
      </div>

      <!-- Tab Content -->
      <div>
        @if (activeTab === 'profile'){
        <div class="animate-fadeIn">
          <app-patient-profile></app-patient-profile>
        </div>
        }
        @if (activeTab === 'createAccount'){
        <div class="animate-fadeIn">
          <app-patient-create-new-profile></app-patient-create-new-profile>
        </div>
        }

        @if (activeTab === 'medicalHistory'){
        <div class="animate-fadeIn">
          <app-patient-medical-history></app-patient-medical-history>
        </div>
        }
      </div>

    </div>
  </div>
</section>
