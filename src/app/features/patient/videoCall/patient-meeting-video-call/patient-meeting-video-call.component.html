<div class="relative h-full">

  <div class="absolute top-[20px] right-[20px] bg-black rounded-full
          w-[60px] h-[60px] md:hidden flex justify-center items-center z-50" (click)="openWhatsApp()">
    <i class="fa-brands fa-whatsapp text-green-600 text-[35px] cursor-pointer"></i>
  </div>

  <div class="w-full h-full flex flex-col min-h-0">
    <div class="bg-white rounded-2xl p-5 w-full h-full flex flex-col min-h-0 shadow-sm border border-slate-100">
      
      <!-- Video Area -->
      <div class="relative rounded-2xl overflow-hidden bg-slate-950 flex-1 min-h-0 shadow-inner flex flex-col justify-between">
        
        <!-- Remote Video Stream -->
        <div id="remote-video" class="w-full h-full absolute inset-0 flex items-center justify-center z-0">
          @if (showWaitingForOtherParticipant()) {
          <div class="flex flex-col items-center gap-3 text-slate-400">
            <div class="w-12 h-12 rounded-full border-4 border-slate-700 border-t-blue-500 animate-spin"></div>
            <span class="text-sm font-medium">Waiting for doctor...</span>
          </div>
          }
        </div>

        <!-- Floating Badges Overlay -->
        <div class="absolute top-4 left-4 z-10 flex gap-2">
          @if (callTimerLabel()) {
          <div class="ts-video-header-badge">
            <i class="fa-regular fa-clock text-blue-400"></i>
            <span>{{ callTimerLabel() }}</span>
          </div>
          }
          <div class="ts-video-header-badge">
            <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
            <span class="text-xs uppercase tracking-wider">Live</span>
          </div>
        </div>

        <!-- Local Video (Self View) -->
        <div id="local-video"
          class="absolute bottom-4 right-4 w-40 h-28 bg-slate-900 rounded-xl border-2 border-white/90 shadow-2xl overflow-hidden transition-all duration-300 hover:scale-105 z-20">
        </div>

      </div>

      <!-- Controls Panel -->
      <div class="flex justify-center items-center gap-5 py-4 flex-shrink-0">
        <button type="button" (click)="toggleMic()"
          [class]="micMuted ? 'ts-video-btn-control muted' : 'ts-video-btn-control active'"
          title="Toggle mic">
          <i [class]="micMuted ? 'fa-solid fa-microphone-slash' : 'fa-solid fa-microphone'"></i>
        </button>
        <button type="button" (click)="endCall()"
          class="ts-video-btn-control end-call"
          title="End call">
          <i class="fa-solid fa-phone-slash"></i>
        </button>
        <button type="button" (click)="toggleCamera()"
          [class]="cameraOff ? 'ts-video-btn-control muted' : 'ts-video-btn-control active'"
          title="Toggle camera">
          <i [class]="cameraOff ? 'fa-solid fa-video-slash' : 'fa-solid fa-video'"></i>
        </button>
      </div>

    </div>
  </div>

</div>
