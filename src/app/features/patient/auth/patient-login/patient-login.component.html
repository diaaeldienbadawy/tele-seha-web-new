<div class="min-h-screen bg-[#F7F9FE] flex flex-col justify-between p-4 sm:p-6 md:p-8">

  <!-- Header Logo & Close -->
  <div class="w-full max-w-md mx-auto flex items-center justify-between mb-6 z-10">
    <div class="w-[25px]"></div>
    <app-auth-logo class="mx-auto"></app-auth-logo>
    <i class="fa-solid fa-xmark text-[#899CC9] hover:text-slate-600 transition-colors duration-200 text-[25px] cursor-pointer ms-auto" (click)="clearLocalStorage()"></i>
  </div>

  <!-- Content Centered -->
  <div class="flex-1 flex items-center justify-center my-4 w-full">
    <div class="w-full max-w-md bg-white rounded-3xl border border-slate-100/80 shadow-[0_10px_40px_rgba(0,0,0,0.04)] p-6 sm:p-10 transition-all duration-300">

      <h2 class="text-slate-800 text-[28px] sm:text-[32px] font-bold leading-tight tracking-tight text-center sm:text-start">
        {{ 'auth.welcomeBack' | translate }}
      </h2>

      <p class="text-slate-500 text-[14px] font-normal leading-normal mt-[8px] text-center sm:text-start">
        {{ 'auth.signInToAccount' | translate }}
      </p>

      <form [formGroup]="mobileForm" (ngSubmit)="submit()" class="mt-[30px]">

        <!-- Phone -->
        <div class="mb-[25px]">
          <label class="block text-slate-700 text-[14px] font-semibold leading-normal mb-[10px]">
            {{ 'auth.phone' | translate }}
          </label>

          <div class="border border-slate-200 bg-slate-50/40 rounded-full px-[18px] py-[4px] flex items-center w-full focus-within:border-(--primary-color) focus-within:ring-4 focus-within:ring-(--primary-color)/15 focus-within:bg-white transition-all duration-300 ease-in-out" dir="ltr">
            <input #phoneInput type="tel" [placeholder]="'auth.enterPhone' | translate" maxlength="11" inputmode="numeric" pattern="[0-9]*"
              class="text-slate-800 text-[14px] font-normal bg-transparent w-full outline-none h-[48px]" />
            <i class="fa-solid fa-mobile-screen text-[#899CC9]/80 text-[18px] mr-2 shrink-0"></i>
          </div>
        </div>

        <!-- Submit -->
        <div class="w-full mt-[30px]">
          <button type="submit" [disabled]="isLoading" class="w-full bg-gradient-to-r from-(--primary-color) to-[#006ba5] text-white hover:from-[#006ba5] hover:to-[#005a8c] px-[20px] h-[54px] rounded-full text-[16px] font-bold leading-none flex items-center justify-center gap-2 shadow-lg shadow-(--primary-color)/15 hover:shadow-xl hover:shadow-(--primary-color)/25 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 ease-in-out cursor-pointer">
            @if (isLoading) {
              <i class="fa-solid fa-spinner fa-spin mr-2"></i>
            }
            <span>{{ 'auth.signIn' | translate }}</span>
            <i class="fa-solid fa-arrow-right-to-bracket text-[15px] ml-1"></i>
          </button>
        </div>

      </form>

    </div>
  </div>

  <!-- Footer Spacer/Copyright -->
  <div class="w-full text-center text-xs text-slate-400 mt-6">
    {{ 'auth.copyright' | translate }}
  </div>

</div>
