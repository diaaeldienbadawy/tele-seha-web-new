<div class="min-h-screen bg-[#F7F9FE] flex flex-col justify-between p-4 sm:p-6 md:p-8">

  <!-- Header Logo & Logout -->
  <div class="w-full max-w-lg mx-auto flex items-center justify-between mb-6 z-10">
    <app-auth-logo></app-auth-logo>
    <button (click)="clearLocalStorage()" class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-slate-600 hover:text-red-600 bg-slate-100/60 hover:bg-red-50 rounded-full border border-slate-200/60 hover:border-red-100 transition-all duration-200 cursor-pointer">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span>{{ 'auth.logout' | translate }}</span>
    </button>
  </div>

  <!-- Content Centered -->
  <div class="flex-1 flex items-center justify-center my-4 w-full">
    <div class="w-full max-w-lg bg-white rounded-3xl border border-slate-100/80 shadow-[0_10px_40px_rgba(0,0,0,0.04)] p-6 sm:p-10 transition-all duration-300">

      <h2 class="text-slate-800 text-[28px] sm:text-[32px] font-bold leading-tight tracking-tight text-center sm:text-start mb-6">
        {{ 'auth.loginTo' | translate }}
      </h2>

      <div class="flex flex-col gap-[20px]">

        @for (patient of patients; track $index) {
        <div class="bg-[#FFFFFF] shadow-[0px_2px_8px_0px_#DADADA80] rounded-[20px] p-[20px]
          flex justify-between items-center gap-[15px] cursor-pointer border border-slate-100 hover:border-[#007BBD]/30 hover:shadow-lg transition-all duration-200">

          <div class="flex items-center gap-[12px]">
            <img class="w-[30px] h-[30px] rounded-full" src="assets/images/Group 1000005886.svg" alt="">

            <h3 class="text-slate-800 text-[18px] font-semibold">
              {{ patient.name }}
            </h3>
          </div>

          <div class="w-fit">
            <button (click)="selectProfile(patient)" class="bg-[#007BBD] text-white px-[20px] py-[8px]
              rounded-full text-[14px] font-bold transition-all duration-300 hover:bg-[#005e91] shadow-md shadow-[#007BBD]/15 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 cursor-pointer">
              {{ 'auth.login' | translate }}
            </button>
          </div>

        </div>
        }

      </div>

    </div>
  </div>

  <!-- Footer -->
  <div class="w-full text-center text-xs text-slate-400 mt-6">
    {{ 'auth.copyright' | translate }}
  </div>

</div>
